<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爆上陀螺 Jayblade 3D (真 3D 剛體力學引擎)</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #060913; color: #fff; font-family: -apple-system, sans-serif; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-overlay { position: absolute; top: 10px; left: 10px; z-index: 100; max-height: 95vh; overflow-y: auto; }
        .ui-card { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(0, 212, 255, 0.4); border-radius: 16px; padding: 14px; width: 340px; box-shadow: 0 10px 40px rgba(0, 212, 255, 0.25); }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        h1 { font-size: 1.15rem; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin: 0; }
        p { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
        .btn { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: #fff; border: none; padding: 10px; font-size: 0.88rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 6px; text-decoration: none; display: block; text-align: center; }
        .btn-ai { background: linear-gradient(135deg, #00b894, #00cec9); }
        .btn-secondary { background: #1e293b; border: 1px solid rgba(255,255,255,0.2); }
        .status-banner { font-size: 0.85rem; font-weight: bold; color: #38bdf8; margin-bottom: 6px; }

        .debug-panel { font-family: monospace; font-size: 0.72rem; color: #38bdf8; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.3); margin-top: 6px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="ui-overlay" id="ui-overlay-box">
        <div class="ui-card">
            <div class="header-row">
                <h1>🌀 真 3D 剛體力學模擬器</h1>
            </div>
            <p>無限制 3D 空間：自由傾斜 / 進動搖晃 / 撞擊力矩傳導</p>
            
            <a href="./index.html" class="btn btn-secondary" style="font-size:0.75rem; padding:6px; margin-bottom:6px;">⬅️ 返回 2D 版</a>

            <div class="status-banner" id="match-status">請發射測試真 3D 碰撞...</div>
            <button class="btn btn-ai" id="btn-vs-ai">🎮 發射對決 (3D 物理全開)</button>

            <div class="debug-panel">
                <h4>⚙️ 3D 姿態向量 (3D Pose & Angular Momentum)</h4>
                <div id="telemetry">等待發射...</div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        var STADIUM_R = 9.0;
        var scene, camera, renderer, controls, world, defaultMaterial, stadiumMaterial;
        var activeTops = [];
        var isSimulating = false;
        var lastTime = performance.now();

        function True3DBeyblade(scene, world, material, config) {
            this.name = config.name;
            this.radius = 1.1;
            this.mass = 0.05; // 50g

            // 1. 建立真實 3D 剛體 (Cone + Cylinder 複合碰撞形狀)
            this.body = new CANNON.Body({
                mass: this.mass,
                material: material,
                linearDamping: 0.015,
                angularDamping: 0.0002 // 極低阻尼，靠真實底軸摩擦減速
            });

            // 下方尖端底軸 (Cone)
            var tipShape = new CANNON.Cylinder(0.1, this.radius, 0.4, 16);
            this.body.addShape(tipShape, new CANNON.Vec3(0, -0.2, 0));

            // 上方攻擊金屬環 (Cylinder)
            var ringShape = new CANNON.Cylinder(this.radius, this.radius, 0.3, 16);
            this.body.addShape(ringShape, new CANNON.Vec3(0, 0.15, 0));

            // 設定初始位置與角速度向量 (繞 Y 軸高超速旋轉)
            this.body.position.set(config.x, 0.5, config.z);
            var spinRpmRad = (config.rpm * 2 * Math.PI) / 60 * (config.isRightSpin ? -1 : 1);
            
            // 賦予微小的初始傾斜角，觸發天然的 3D 進動
            this.body.angularVelocity.set(0.2, spinRpmRad, -0.1);

            // 2. Three.js 視覺 Mesh
            this.group = new THREE.Group();
            
            var crownGeo = new THREE.CylinderGeometry(this.radius, this.radius * 0.8, 0.35, 16);
            var crownMat = new THREE.MeshStandardMaterial({ color: config.color, metalness: 0.9, roughness: 0.15 });
            var crownMesh = new THREE.Mesh(crownGeo, crownMat);
            this.group.add(crownMesh);

            var tipGeo = new THREE.ConeGeometry(this.radius * 0.8, 0.4, 16);
            var tipMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
            var tipMesh = new THREE.Mesh(tipGeo, tipMat);
            tipMesh.position.y = -0.35;
            tipMesh.rotation.x = Math.PI;
            this.group.add(tipMesh);

            scene.add(this.group);
            world.addBody(this.body);
        }

        True3DBeyblade.prototype.update = function() {
            // 完全由 CANNON.js 3D 剛體物理引擎接管位置與三維姿態四元數 (Quaternion)
            this.group.position.copy(this.body.position);
            this.group.quaternion.copy(this.body.quaternion);

            // 碗狀盤面 3D 坡度重力 (沿盤面切線拉向中心)
            var dist = Math.hypot(this.body.position.x, this.body.position.z);
            if (dist > 0.1 && dist < STADIUM_R) {
                var pull = 0.5 * dist;
                this.body.applyForce(new CANNON.Vec3(-this.body.position.x / dist * pull, 0, -this.body.position.z / dist * pull), this.body.position);
            }
        };

        function initEngine() {
            var container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 16, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            var light = new THREE.DirectionalLight(0x00f2fe, 1.2);
            light.position.set(10, 20, 10);
            scene.add(light);

            // 初始化 3D 物理世界 (不鎖死任何軸向)
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);

            defaultMaterial = new CANNON.Material('default');
            stadiumMaterial = new CANNON.Material('stadium');

            var contactMat = new CANNON.ContactMaterial(defaultMaterial, stadiumMaterial, {
                friction: 0.15,
                restitution: 0.75 // 守恆彈性恢復
            });
            world.addContactMaterial(contactMat);

            // 建立 3D 碗狀戰鬥盤 (物理碗面)
            var stadiumGeo = new THREE.CylinderGeometry(STADIUM_R, STADIUM_R - 2.0, 1.0, 64);
            var stadiumMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.2 });
            var stadiumMesh = new THREE.Mesh(stadiumGeo, stadiumMat);
            stadiumMesh.position.y = -0.5;
            scene.add(stadiumMesh);

            var groundBody = new CANNON.Body({ mass: 0, material: stadiumMaterial });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            document.getElementById('btn-vs-ai').onclick = launch3DBattle;
            window.addEventListener('resize', onWindowResize);
            animate(performance.now());
        }

        function launch3DBattle() {
            activeTops.forEach(function(t) { world.remove(t.body); scene.remove(t.group); });
            activeTops = [];

            var p1 = new True3DBeyblade(scene, world, defaultMaterial, {
                name: '🔵 火鷹飛龍', x: -2.5, z: 0, rpm: 12000, isRightSpin: true, color: 0x0284c7
            });
            p1.body.velocity.set(3.0, 0, 1.5);

            var p2 = new True3DBeyblade(scene, world, defaultMaterial, {
                name: '🔴 影武赤狼', x: 2.5, z: 0, rpm: 11500, isRightSpin: false, color: 0xe11d48
            });
            p2.body.velocity.set(-3.0, 0, -1.5);

            activeTops.push(p1, p2);
            isSimulating = true;
        }

        function animate(now) {
            requestAnimationFrame(animate);
            var dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (isSimulating) {
                world.step(1 / 240, dt, 10);

                var debugText = '';
                activeTops.forEach(function(t) {
                    t.update();
                    var rpm = Math.round(Math.abs(t.body.angularVelocity.y) * 60 / (2 * Math.PI));
                    
                    // 計算陀螺相對於垂直方向的 3D 傾斜角度
                    var up = new CANNON.Vec3(0, 1, 0);
                    var topUp = t.body.quaternion.vmult(new CANNON.Vec3(0, 1, 0));
                    var tiltDeg = (Math.acos(topUp.dot(up)) * 180 / Math.PI).toFixed(1);

                    debugText += '<b>' + t.name + '</b><br>' +
                        '• 轉速: ' + rpm + ' RPM<br>' +
                        '• 3D 傾斜角: ' + tiltDeg + '°<br>' +
                        '• 角速度 (ωx, ωy, ωz): (' + t.body.angularVelocity.x.toFixed(1) + ', ' + t.body.angularVelocity.y.toFixed(1) + ', ' + t.body.angularVelocity.z.toFixed(1) + ')<br><br>';
                });
                document.getElementById('telemetry').innerHTML = debugText;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
