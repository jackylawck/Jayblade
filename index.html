<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>爆上陀螺 Jayblade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🌀 爆上陀螺 Jayblade 🌀</h1>
  <p class="subtitle">Jarvis 上桓專屬 物理對戰模擬器</p>

  <!-- 選單面板 -->
  <div id="setup-panel" class="card">
    <div class="mode-buttons">
      <button class="btn" onclick="setGameMode('SINGLE')">🎮 單人對戰 (VS CPU)</button>
      <button class="btn btn-secondary" onclick="setGameMode('VERSUS')">⚔️ 雙人對決 (1P VS 2P)</button>
    </div>

    <hr>

    <div id="config-section">
      <h3>P1 (Jarvis 上桓) 陀螺配件設定</h3>
      <div class="form-group">
        <label>撞擊環 (Crown): </label>
        <select id="p1-crown"></select>
      </div>
      <div class="form-group">
        <label>動力底軸 (Tip): </label>
        <select id="p1-tip"></select>
      </div>
      <div class="form-group">
        <label>發射力度: </label>
        <select id="p1-power">
          <option value="MEDIUM">中度 (穩定平衡)</option>
          <option value="HEAVY">重度 (極速衝撞/微晃動)</option>
          <option value="LIGHT">輕度 (高精準/低耗損)</option>
        </select>
      </div>

      <h4>選擇降落位置 (網格 1-18):</h4>
      <div id="grid-selector" class="grid-container"></div>
    </div>

    <button class="btn launch-btn" onclick="startGame()">3, 2, 1... Go Shoot!</button>
  </div>

  <!-- 戰鬥畫布 -->
  <div id="game-panel" class="card" style="display:none;">
    <div id="status-bar">準備發射...</div>
    <div id="stats-display">🏆 Jarvis 戰績載入中...</div>
    <div id="fps-counter">FPS: 60</div>
    <div id="canvas-container">
      <canvas id="arena"></canvas>
    </div>
    <br>
    <button class="btn" onclick="resetGame()">🔄 重新設定 / 再次對戰</button>
  </div>

  <!-- 按順序載入 JS 模組 -->
  <script src="js/parts.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
