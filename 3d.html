    <title>爆上陀螺 Jayblade</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-overlay { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; max-height: 98vh; overflow-y: auto; }
        .ui-card { background: rgba(18, 18, 24, 0.92); backdrop-filter: blur(12px); border: 1px solid rgba(0, 210, 211, 0.4); border-radius: 14px; padding: 14px; width: 360px; pointer-events: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.6); }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        h1 { font-size: 1.15rem; color: #00d2d3; margin: 0; }
        .lang-btn { background: rgba(0, 210, 211, 0.2); border: 1px solid #00d2d3; color: #00d2d3; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; font-weight: bold; }
        p { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; line-height: 1.3; }
        .btn { background: linear-gradient(135deg, #ff9f43, #ff5252); color: #fff; border: none; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4); transition: transform 0.1s; margin-top: 4px; text-decoration: none; display: block; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-purple { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .btn-secondary { background: #1e293b; border: 1px solid rgba(255,255,255,0.2); }
        .btn-sm { font-size: 0.75rem; padding: 4px 8px; }
        .status-banner { font-size: 0.85rem; font-weight: bold; color: #ffcc00; margin-bottom: 6px; min-height: 20px; text-shadow: 0 0 8px rgba(255,204,0,0.5); }
        
        .parts-panel { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px; margin: 6px 0; border: 1px solid rgba(255,255,255,0.1); }
        .parts-panel h3 { font-size: 0.82rem; color: #ffcc00; margin-bottom: 6px; }
        .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 0.75rem; }
        .form-row label { color: #ccc; }
        .form-row select, .form-row input[type="text"] { background: rgba(0,0,0,0.5); color: #00d2d3; border: 1px solid rgba(0,210,211,0.3); border-radius: 4px; padding: 2px 6px; font-size: 0.75rem; width: 60%; }

        /* 🛠️ 已修復：完全展開高度，取消 160px 限制，無 Scrollbar */
        .debug-panel { font-family: 'Courier New', Courier, monospace; font-size: 0.72rem; color: #00ff66; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 6px; border: 1px solid rgba(0, 255, 102, 0.4); margin-top: 6px; height: auto; min-height: 120px; overflow: visible; line-height: 1.35; }
        .debug-panel h4 { color: #ffcc00; margin-bottom: 6px; font-size: 0.78rem; border-bottom: 1px solid rgba(255,204,0,0.3); padding-bottom: 2px; }
        
        .energy-chart-box { margin-top: 6px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .chart-title { font-size: 0.7rem; color: #2ecc71; margin-bottom: 2px; }
        #energy-canvas { width: 100%; height: 35px; display: block; }
        .webrtc-box { margin-top: 6px; display: flex; gap: 4px; }
        .webrtc-input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 4px 8px; color: #fff; width: 60%; font-family: monospace; font-size: 0.75rem; }
        .touch-zone { position: absolute; bottom: 20px; right: 20px; width: 100px; height: 100px; border: 2px dashed rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 0.7rem; color: #aaa; background: rgba(255,255,255,0.05); pointer-events: auto; z-index: 100; }
    </style>

            },

                title: "🌀 Jayblade",
                subtitle: "Rigid-body Physics & Parts Simulator",
                back2d: "⬅️ Switch to 2D Version",
                p1PanelTitle: "🔵 P1 Custom Parts",
                lblName: "Name:",
                lblCrown: "Crown Ring:",
                lblTip: "Tip Base:",
                lblSpin: "Spin Direction:",
                lblPower: "Launch Power:",
                optSpinR: "Right Spin (CW)",
                optSpinL: "Left Spin (CCW)",
                optPowerH: "Heavy (High RPM)",
                optPowerM: "Medium (Balanced)",
                optPowerL: "Light (Precision)",
                ready: "Ready to launch...",
                btn2p: "🎮 Launch Battle",
                btn4p: "🔥 4-Player Battle Royal",
                btnHelper: "🎯 Toggle Precession Vectors",
                debugTitle: "⚙️ Live Physics Telemetry",
                debugWait: "Awaiting telemetry...",
                chartTitle: "⚡ Kinetic Energy Retention:",
                placeholderRoom: "6-digit Room ID",
                btnConnect: "Connect Room",
                touchLaunch: "👆 Swipe to Launch",
                langBtn: "繁體中文",
                battleInProg: " Players Battle...",
                outOfBounds: "❌ Out / Shattered",
                winSuffix: " Wins!",
                angVel: "• Angular Velocity ω:",
                linSpeed: "• Linear Speed v:",
                energy: "• Total Kinetic Energy KE:",
                hp: "• Burst Health HP:"
            }
        };

        let currentLang = 'zh';
        let scene, camera, renderer, controls;
        let world, defaultMaterial, stadiumMaterial;
        let activeTops = [];
        let isSimulating = false, showPrecessionVectors = false;
        let lastTime = performance.now(), matchStartTime = 0;
        let peer = null, peerConn = null;

        const STADIUM_RADIUS = 12;
        const GEAR_RAIL_RADIUS = 10.5;

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            const t = i18n[currentLang];

            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-subtitle').innerText = t.subtitle;
            document.getElementById('btn-back-2d').innerText = t.back2d;
            document.getElementById('ui-p1-panel-title').innerText = t.p1PanelTitle;
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('lbl-crown').innerText = t.lblCrown;
            document.getElementById('lbl-tip').innerText = t.lblTip;
            document.getElementById('lbl-spin').innerText = t.lblSpin;
            document.getElementById('lbl-power').innerText = t.lblPower;
            document.getElementById('opt-spin-r').innerText = t.optSpinR;
            document.getElementById('opt-spin-l').innerText = t.optSpinL;
            document.getElementById('opt-power-h').innerText = t.optPowerH;
            document.getElementById('opt-power-m').innerText = t.optPowerM;
            document.getElementById('opt-power-l').innerText = t.optPowerL;
            document.getElementById('btn-2p').innerText = t.btn2p;
            document.getElementById('btn-4p').innerText = t.btn4p;

            document.getElementById('ui-debug-title').innerText = t.debugTitle;
            document.getElementById('ui-chart-title').innerText = t.chartTitle;
            document.getElementById('room-id-input').placeholder = t.placeholderRoom;
            document.getElementById('btn-connect').innerText = t.btnConnect;
            document.getElementById('touch-launch-zone').innerText = t.touchLaunch;
            document.getElementById('btn-lang').innerText = t.langBtn;

            initPartsSelectors();
        }

        function initPartsSelectors() {
            const crownSelect = document.getElementById('p1-crown');
            const tipSelect = document.getElementById('p1-tip');
            
            const selectedCrown = crownSelect.value;
            const selectedTip = tipSelect.value;

            crownSelect.innerHTML = '';
            tipSelect.innerHTML = '';

            Object.keys(PARTS_DB.CROWNS).forEach(k => {
                const item = PARTS_DB.CROWNS[k];
                const opt = document.createElement('option');
                opt.value = k;
                opt.innerText = currentLang === 'zh' ? item.name_zh : item.name_en;
                if (k === selectedCrown) opt.selected = true;
                crownSelect.appendChild(opt);
            });

            Object.keys(PARTS_DB.TIPS).forEach(k => {
                const item = PARTS_DB.TIPS[k];
                const opt = document.createElement('option');
                opt.value = k;
                opt.innerText = currentLang === 'zh' ? item.name_zh : item.name_en;
                if (k === selectedTip) opt.selected = true;
                tipSelect.appendChild(opt);
            });
        }

        function init3DEngine() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0f);
            scene.fog = new THREE.FogExp2(0x0a0a0f, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 22);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffddaa, 1.2);
            dirLight.position.set(15, 30, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();

            defaultMaterial = new CANNON.Material('default');
            stadiumMaterial = new CANNON.Material('stadium');

            const contactMat = new CANNON.ContactMaterial(defaultMaterial, stadiumMaterial, {
                friction: 0.3,
                restitution: 0.2
            });
            world.addContactMaterial(contactMat);

            create3DStadium();
            createGearRail();
            initPartsSelectors();
            initWebRTC();

            window.addEventListener('resize', onWindowResize);
            animate(performance.now());
            
            launchCustom3DBattle(2);
        }

        function create3DStadium() {
            const geo = new THREE.CylinderGeometry(STADIUM_RADIUS, STADIUM_RADIUS - 1, 1.5, 48, 1, false);
            const mat = new THREE.MeshStandardMaterial({ color: 0x1e1e38, roughness: 0.4, metalness: 0.6 });
            const stadiumMesh = new THREE.Mesh(geo, mat);
            stadiumMesh.position.y = -0.75;
            scene.add(stadiumMesh);

            const ringGeo = new THREE.RingGeometry(STADIUM_RADIUS - 0.2, STADIUM_RADIUS + 0.1, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00d2d3, side: THREE.DoubleSide });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = Math.PI / 2;
            ringMesh.position.y = 0.02;
            scene.add(ringMesh);

            const groundBody = new CANNON.Body({ mass: 0, material: stadiumMaterial });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);
        }

        function createGearRail() {
            const railGeo = new THREE.TorusGeometry(GEAR_RAIL_RADIUS, 0.35, 16, 64);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x660022, roughness: 0.2, metalness: 0.9 });
            const gearRailMesh = new THREE.Mesh(railGeo, railMat);
            gearRailMesh.rotation.x = Math.PI / 2;
            gearRailMesh.position.y = 0.2;
            scene.add(gearRailMesh);
        }

        class Beyblade3D {
            constructor(x, y, z, color, name, isRightSpin = true, crownKey = 'FEATHER', tipKey = 'FLAT', powerKey = 'HEAVY') {
                this.name = name;
                this.color = color;
                this.isRightSpin = isRightSpin;
                
                const crown = PARTS_DB.CROWNS[crownKey] || PARTS_DB.CROWNS.FEATHER;
                const tip = PARTS_DB.TIPS[tipKey] || PARTS_DB.TIPS.FLAT;
                
                this.rpm = powerKey === 'HEAVY' ? 13000 : (powerKey === 'MEDIUM' ? 10000 : 7000);
                this.radius = 1.2;
                this.shatterHp = 100;
                this.burstResist = crown.burstResist || 0.85;
                this.isShattered = false;
                this.xdashCooldown = 0;

                this.group = new THREE.Group();
                const crownGeo = new THREE.CylinderGeometry(this.radius, this.radius * 0.85, 0.4, 12);
                const crownMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2 });
                this.group.add(new THREE.Mesh(crownGeo, crownMat));

                const coreGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const coreMat = new THREE.MeshPhongMaterial({ color: 0x00d2d3, transparent: true, opacity: 0.9 });
                const coreMesh = new THREE.Mesh(coreGeo, coreMat);
                coreMesh.position.y = 0.2;
                this.group.add(coreMesh);

                scene.add(this.group);

                const mass = crown.mass || 0.045;
                this.body = new CANNON.Body({ mass: mass, material: defaultMaterial });
                this.body.addShape(new CANNON.Sphere(1.0));
                this.body.position.set(x, y, z);
                
                this.body.linearDamping = 0.04;
                this.body.angularDamping = 0.001;

                const spinRad = (this.rpm * 2 * Math.PI) / 60 * (isRightSpin ? -1 : 1);
                this.body.angularVelocity.set(0, spinRad, 0);

                this.Iz = 0.5 * mass * Math.pow(this.radius * 0.1, 2);

                world.addBody(this.body);
            }

            update(dt) {
                if (this.isShattered) return;
                this.group.position.copy(this.body.position);
                this.group.quaternion.copy(this.body.quaternion);
                this.rpm = Math.abs(this.body.angularVelocity.y) * 60 / (2 * Math.PI);

                const distFromCenter = Math.hypot(this.body.position.x, this.body.position.z);
                if (distFromCenter > 0.2 && distFromCenter < STADIUM_RADIUS) {
                    const pullForce = 0.15 * distFromCenter;
                    const pullX = (-this.body.position.x / distFromCenter) * pullForce;
                    const pullZ = (-this.body.position.z / distFromCenter) * pullForce;
                    this.body.applyForce(new CANNON.Vec3(pullX, 0, pullZ), this.body.position);
                }

                if (this.xdashCooldown > 0) this.xdashCooldown -= dt;
                if (this.xdashCooldown <= 0 && Math.abs(distFromCenter - GEAR_RAIL_RADIUS) < 0.6) {
                    const spinDir = this.isRightSpin ? -1 : 1;
                    const tangentX = (-this.body.position.z / distFromCenter) * spinDir;
                    const tangentZ = (this.body.position.x / distFromCenter) * spinDir;
                    this.body.applyImpulse(new CANNON.Vec3(tangentX * 0.25, 0.05, tangentZ * 0.25), this.body.position);
                    this.xdashCooldown = 0.3;
                }

                this.body.angularVelocity.y *= 0.9994;
            }

            shatter() {
                if (this.isShattered) return;
                this.isShattered = true;
                world.remove(this.body);
                scene.remove(this.group);
            }
        }

        function launchCustom3DBattle(count = 2) {
            activeTops.forEach(t => { if (!t.isShattered) world.remove(t.body); scene.remove(t.group); });
            activeTops = [];

            const t = i18n[currentLang];

            const p1Name = document.getElementById('p1-name').value || (currentLang === 'zh' ? '火鷹飛龍' : 'Falcon Drake');
            const p1Crown = document.getElementById('p1-crown').value;
            const p1Tip = document.getElementById('p1-tip').value;
            const p1Spin = document.getElementById('p1-spin').value === 'RIGHT';
            const p1Power = document.getElementById('p1-power').value;

            const top1 = new Beyblade3D(-3.5, 0.5, 0, 0x1e90ff, `🔵 ${p1Name}`, p1Spin, p1Crown, p1Tip, p1Power);
            top1.body.velocity.set(2.5, 0, 1.5);
            activeTops.push(top1);

            const p2Name = currentLang === 'zh' ? '影武赤狼' : 'Shadow Wolf';
            const top2 = new Beyblade3D(3.5, 0.5, 0, 0xff3838, `🔴 ${p2Name}`, false, 'DRAKE', 'FLAT', 'HEAVY');
            top2.body.velocity.set(-2.5, 0, -1.5);
            activeTops.push(top2);

            if (count === 4) {
                const p3Name = currentLang === 'zh' ? '翡翠巨錘' : 'Jade Hammer';
                const top3 = new Beyblade3D(0, 0.5, -3.5, 0x2ecc71, `🟢 ${p3Name}`, true, 'HEAVY', 'BALL', 'MEDIUM');
                top3.body.velocity.set(1.0, 0, 2.5);
                activeTops.push(top3);

                const p4Name = currentLang === 'zh' ? '帝王紫刃' : 'Imperial Blade';
                const top4 = new Beyblade3D(0, 0.5, 3.5, 0x9b59b6, `🟣 ${p4Name}`, false, 'WIZARD', 'NEEDLE', 'HEAVY');
                top4.body.velocity.set(-1.0, 0, -2.5);
                activeTops.push(top4);
            }

            matchStartTime = performance.now();
            isSimulating = true;
            document.getElementById('match-status').innerText = `⚔️ ${count} ${t.battleInProg}`;
        }

        function toggleHelper() {
            showPrecessionVectors = !showPrecessionVectors;
            alert(showPrecessionVectors ? "🎯 Precession vectors ON" : "🎯 Precession vectors OFF");
        }

        function initWebRTC() {
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            peer = new Peer('jayblade-' + code);
            peer.on('open', () => { document.getElementById('room-id-input').value = code; });
        }

        function connectWebRTC() {
            const target = document.getElementById('room-id-input').value;
            if (target) {
                peerConn = peer.connect('jayblade-' + target);
                peerConn.on('open', () => { document.getElementById('match-status').innerText = "🌐 WebRTC Connected!"; });
            }
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (isSimulating) {
                world.step(1 / 60, dt, 3);
                activeTops.forEach(t => t.update(dt));

                for (let i = 0; i < activeTops.length; i++) {
                    for (let j = i + 1; j < activeTops.length; j++) {
                        const p1 = activeTops[i], p2 = activeTops[j];
                        if (p1.isShattered || p2.isShattered) continue;
                        if (p1.body.position.distanceTo(p2.body.position) < 2.0) {
                            p1.shatterHp -= 0.5;
                            p2.shatterHp -= 0.5;
                        }
                    }
                }

                const inGracePeriod = (now - matchStartTime) < 2500;
                activeTops.forEach(t => {
                    if (!t.isShattered) {
                        const dist = Math.hypot(t.body.position.x, t.body.position.z);
                        if (!inGracePeriod && dist > STADIUM_RADIUS) {
                            t.shatter();
                        } else if (t.shatterHp <= 0 || t.rpm < 100) {
                            t.shatter();
                        }
                    }
                });

                const t = i18n[currentLang];
                let debugHTML = '';
                activeTops.forEach(topItem => {
                    if (!topItem.isShattered) {
                        const linSpeed = topItem.body.velocity.norm().toFixed(2);
                        const angVelOmega = (Math.abs(topItem.body.angularVelocity.y)).toFixed(1);
                        const ke = (0.5 * topItem.body.mass * topItem.body.velocity.norm2() + 0.5 * topItem.Iz * Math.pow(topItem.body.angularVelocity.y, 2)).toFixed(3);
                        
                        debugHTML += `<b>${topItem.name}</b><br>` +
                            `${t.angVel} ${angVelOmega} rad/s (${Math.round(topItem.rpm)} RPM)<br>` +
                            `${t.linSpeed} ${linSpeed} m/s<br>` +
                            `${t.energy} ${ke} J<br>` +
                            `${t.hp} ${Math.max(0, Math.round(topItem.shatterHp))}/100<br><br>`;
                    } else {
                        debugHTML += `<b>${topItem.name}</b>: ${t.outOfBounds}<br><br>`;
                    }
                });
                document.getElementById('physics-telemetry-content').innerHTML = debugHTML;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init3DEngine;
    </script>
</body>
</html>
