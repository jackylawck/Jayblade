<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>爆上陀螺 Jayblade Pro (Ultimate)</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <h1>🌀 爆上陀螺 Jayblade Pro 🌀</h1>
  <p class="subtitle">Ultimate 旗艦版：半隱式積分 | 對象池效能 | 主從式 P2P 同步</p>

  <!-- 選單面板 -->
  <div id="setup-panel" class="card">
    <div class="mode-buttons">
      <button class="btn" onclick="setGameMode('SINGLE')">🎮 單人對戰 (VS AI)</button>
      <button class="btn btn-secondary" onclick="setGameMode('VERSUS')">⚔️ 雙人同機 (1P VS 2P)</button>
      <button class="btn btn-online" onclick="setGameMode('ONLINE')">🌐 WebRTC 遠端連線</button>
    </div>

    <hr>

    <!-- 在線連線控制面板 -->
    <div id="online-panel" class="form-group physics-mode-box" style="display:none;">
      <h4>🌐 WebRTC P2P 主從式同步大廳</h4>
      <p style="font-size:12px; color:#aaa; margin-bottom:6px;">你的 Host ID: <b id="my-peer-id" style="color:#00d2d3;">生成中...</b></p>
      <div style="display:flex; gap:6px;">
        <input type="text" id="join-peer-id" placeholder="貼上對手的 Host ID 加入">
        <button class="btn btn-sm btn-secondary" onclick="connectToPeer()">加入房間</button>
      </div>
      <div id="network-status" style="font-size:12px; color:#ffcc00; margin-top:6px;">狀態: 未連線</div>
    </div>

    <div id="config-section">
      <div class="form-group physics-mode-box">
        <label>⚙️ 模擬器物理模式: </label>
        <select id="physics-engine-mode" onchange="switchPhysicsEngineMode(this.value)">
          <option value="ARCADE" selected>🔥 熱血動畫版 (超彈性動能/閃光/強烈衝擊)</option>
          <option value="REALISTIC">🔬 真實擬真版 (能量守恆/穿透修正/動態摩擦)</option>
        </select>
      </div>

      <!-- P1 設定 -->
      <div class="player-box p1-box">
        <h3>🔵 P1 陀螺自訂</h3>
        <div class="form-group"><label>名稱: </label><input type="text" id="p1-name" value="破空飛龍"></div>
        <div class="form-group"><label>顏色: </label><input type="color" id="p1-color" value="#ff3838"></div>
        <div class="form-group"><label>撞擊環: </label><select id="p1-crown"></select></div>
        <div class="form-group"><label>動力底軸: </label><select id="p1-tip"></select></div>
        <div class="form-group">
          <label>發射力度: </label>
          <select id="p1-power">
            <option value="MEDIUM">中度 (穩定平衡)</option>
            <option value="HEAVY">重度 (極速衝撞)</option>
            <option value="LIGHT">輕度 (高精準)</option>
          </select>
        </div>
        <div style="display:flex; gap:6px; margin-top:8px;">
          <button class="btn btn-sm" onclick="exportShareCode('p1')">📤 複製 P1 塗裝碼</button>
          <button class="btn btn-sm btn-secondary" onclick="importShareCode('p1')">📥 匯入塗裝碼</button>
        </div>
      </div>

      <!-- P2 設定 -->
      <div class="player-box p2-box" id="p2-setup-group" style="display:none;">
        <h3>🔴 P2 陀螺自訂</h3>
        <div class="form-group"><label>名稱: </label><input type="text" id="p2-name" value="影武赤狼"></div>
        <div class="form-group"><label>顏色: </label><input type="color" id="p2-color" value="#1e90ff"></div>
        <div class="form-group"><label>撞擊環: </label><select id="p2-crown"></select></div>
        <div class="form-group"><label>動力底軸: </label><select id="p2-tip"></select></div>
        <div class="form-group">
          <label>發射力度: </label>
          <select id="p2-power">
            <option value="MEDIUM">中度 (穩定平衡)</option>
            <option value="HEAVY">重度 (極速衝撞)</option>
            <option value="LIGHT">輕度 (高精準)</option>
          </select>
        </div>
      </div>

      <!-- CPU 難度 -->
      <div class="form-group" id="cpu-difficulty-group">
        <label>CPU 對手難度: </label>
        <select id="cpu-difficulty">
          <option value="EASY">簡單 (輕鬆入門)</option>
          <option value="MEDIUM" selected>普通 (戰術相剋)</option>
          <option value="HARD">困難 (行為樹 AI / 假動作 / 側翼引誘)</option>
        </select>
      </div>

      <h4>選擇 P1 降落位置 (網格 1-18):</h4>
      <div id="grid-selector" class="grid-container"></div>
    </div>

    <button class="btn launch-btn" onclick="startGame()">3, 2, 1... Go Shoot!</button>
  </div>

  <!-- 戰鬥畫布 -->
  <div id="game-panel" class="card" style="display:none;">
    <div id="status-bar">準備發射...</div>
    <div id="stats-display">🏆 戰績載入中...</div>
    <div id="achieve-display">🎖️ 成就數量: 0/3</div>
    
    <div class="canvas-controls">
      <button class="btn btn-sm" onclick="toggleDebugPanel()">📊 物理調試面板</button>
      <button class="btn btn-sm btn-secondary" onclick="toggleBGM()">🎵 BGM 音效</button>
      <span id="ping-display" style="font-size:12px; color:#00d2d3; margin-left:10px;">Ping: -- ms</span>
    </div>

    <div id="canvas-container">
      <canvas id="arena"></canvas>
    </div>

    <div id="debug-panel" class="debug-box" style="display:none;">
      <h4>⚙️ 第一性原理數據 (FPS: <span id="fps-counter">60</span>)</h4>
      <div class="debug-grid">
        <div id="p1-debug">P1: 載入中...</div>
        <div id="p2-debug">P2: 載入中...</div>
      </div>
    </div>

    <br>
    <button class="btn" onclick="resetGame()">🔄 重新設定 / 再次對戰</button>
  </div>

  <script src="js/parts.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
