        .btn:active { transform: scale(0.98); }
        .btn-ai { background: linear-gradient(135deg, #00b894, #00cec9); box-shadow: 0 4px 15px rgba(0, 206, 201, 0.4); }
        .btn-purple { background: linear-gradient(135deg, #a855f7, #6366f1); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
        .btn-secondary { background: #1e293b; border: 1px solid rgba(255,255,255,0.2); }
        .btn-sm { font-size: 0.75rem; padding: 6px 10px; }
        .status-banner { font-size: 0.85rem; font-weight: bold; color: #38bdf8; margin-bottom: 6px; min-height: 20px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }

        .parts-panel h3 { font-size: 0.82rem; color: #f59e0b; margin-bottom: 6px; }
        .p2-title { color: #f43f5e !important; }

        .form-row label { color: #cbd5e1; }
        .form-row select, .form-row input[type="text"] { background: rgba(15, 23, 42, 0.8); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 4px 6px; font-size: 0.75rem; width: 60%; }

        .debug-panel h4 { color: #f59e0b; margin-bottom: 4px; font-size: 0.75rem; border-bottom: 1px solid rgba(245, 158, 11, 0.3); padding-bottom: 2px; }
        
        .toggle-ui-btn { position: fixed; bottom: 15px; left: 15px; z-index: 200; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #0f172a; font-weight: 800; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.5); }

            <div class="status-banner" id="match-status">請選擇對戰模式發射...</div>
            <button class="btn btn-ai" id="btn-vs-ai">🎮 單人對戰 (VS AI)</button>

    <div id="canvas-container"></div>

    <script>
        var STADIUM_RADIUS = 9.5;
        var WALL_HEIGHT = 2.2;
        var PHYSICS_FIXED_TIMESTEP = 1 / 240;
        var PHYSICS_MAX_SUBSTEPS = 10;

        var scene, camera, renderer, controls, world, defaultMaterial, stadiumMaterial;
        var activeTops = [];
        var isSimulating = false;
        var lastTime = performance.now();
        var sparkParticles = [];

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 🌟 3D 對撞火花特效
        function spawn3DSparks(x, y, z, count) {
            for (var i = 0; i < count; i++) {
                var pGeo = new THREE.SphereGeometry(0.08 + Math.random() * 0.06, 6, 6);
                var pMat = new THREE.MeshBasicMaterial({
                    color: Math.random() > 0.3 ? 0xffea00 : 0xff3300,
                    transparent: true,
                    opacity: 1.0
                });
                var mesh = new THREE.Mesh(pGeo, pMat);
                mesh.position.set(x, y + 0.2, z);

                var vx = (Math.random() - 0.5) * 8;
                var vy = 2 + Math.random() * 6;
                var vz = (Math.random() - 0.5) * 8;

                scene.add(mesh);
                sparkParticles.push({ mesh: mesh, vx: vx, vy: vy, vz: vz, life: 1.0 });
            }
        }

        function update3DSparks(dt) {
            for (var i = sparkParticles.length - 1; i >= 0; i--) {
                var p = sparkParticles[i];
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                p.vy -= 18.0 * dt; // 重力下墜

                p.life -= dt * 2.5;
                p.mesh.material.opacity = Math.max(0, p.life);

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    sparkParticles.splice(i, 1);
                }
            }
        }

        // 🌟 帥氣金屬質感陀螺模型
        function Beyblade3DPhysics(scene, world, material, config) {
            this.name = config.name;
            this.isRightSpin = config.isRightSpin;
            this.radius = 1.0;
            this.mass = config.mass || 0.045;

            this.body = new CANNON.Body({
                mass: this.mass,
                material: material,
                linearDamping: 0.02,
                angularDamping: 0.0006
            });

            this.body.addShape(new CANNON.Sphere(this.radius * 0.8));
            this.body.position.set(config.x, config.y, config.z);

            var spinRad = (config.rpm * 2 * Math.PI) / 60 * (this.isRightSpin ? -1 : 1);
            this.body.angularVelocity.set(0, spinRad, 0);

            this.group = new THREE.Group();

            // 1. 金屬攻擊刀刃 Crown
            var crownGeo = new THREE.CylinderGeometry(this.radius, this.radius * 0.8, 0.35, 16);
            var crownMat = new THREE.MeshStandardMaterial({
                color: config.color,
                metalness: 0.9,
                roughness: 0.15
            });
            var crownMesh = new THREE.Mesh(crownGeo, crownMat);
            this.group.add(crownMesh);

            // 2. 齒輪突起細節
            for (var b = 0; b < 6; b++) {
                var toothGeo = new THREE.BoxGeometry(0.2, 0.3, 0.4);
                var toothMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.95, roughness: 0.1 });
                var tooth = new THREE.Mesh(toothGeo, toothMat);
                var ang = (b / 6) * Math.PI * 2;
                tooth.position.set(Math.cos(ang) * (this.radius * 0.88), 0, Math.sin(ang) * (this.radius * 0.88));
                tooth.rotation.y = -ang;
                this.group.add(tooth);
            }

            // 3. 發光能量核心 Core
            var coreGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 16);
            var coreMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, emissive: 0x00f2fe, emissiveIntensity: 0.6 });
            var coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.y = 0.22;
            this.group.add(coreMesh);

            scene.add(this.group);
            world.addBody(this.body);
        }

        Beyblade3DPhysics.prototype.stepPhysics = function(dt) {
            this.group.position.copy(this.body.position);
            this.group.quaternion.copy(this.body.quaternion);

            var distFromCenter = Math.hypot(this.body.position.x, this.body.position.z);
            if (distFromCenter > 0.1 && distFromCenter < STADIUM_RADIUS) {
                var pull = 0.42 * distFromCenter; // 碗狀中心引力
                var fx = (-this.body.position.x / distFromCenter) * pull;
                var fz = (-this.body.position.z / distFromCenter) * pull;
                this.body.applyForce(new CANNON.Vec3(fx, 0, fz), this.body.position);
            }
            this.body.angularVelocity.y *= 0.9997;
        };

        function initEngine() {
            var container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060913); // 深夜電競科技背景

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 18);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 🌟 賽場高質感舞台燈光
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            var mainSpot = new THREE.SpotLight(0x38bdf8, 2.5);
            mainSpot.position.set(0, 25, 0);
            mainSpot.angle = Math.PI / 3;
            mainSpot.penumbra = 0.5;
            scene.add(mainSpot);

            var sideLight1 = new THREE.DirectionalLight(0xff7e5f, 1.2);
            sideLight1.position.set(15, 20, 10);
            scene.add(sideLight1);

            var sideLight2 = new THREE.DirectionalLight(0x00f2fe, 1.2);
            sideLight2.position.set(-15, 20, -10);
            scene.add(sideLight2);

            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);

            defaultMaterial = new CANNON.Material('default');
            stadiumMaterial = new CANNON.Material('stadium');

            var contactMat = new CANNON.ContactMaterial(defaultMaterial, stadiumMaterial, { friction: 0.25, restitution: 0.65 });
            world.addContactMaterial(contactMat);

            create3DStadiumWithWalls();
            bindEvents();

            window.addEventListener('resize', onWindowResize);
            animate(performance.now());
            
            document.getElementById('ui-overlay-box').style.display = 'block';
        }

        // 🌟 美化版 Beyblade X 原版戰鬥盤
        function create3DStadiumWithWalls() {
            // 1. 亮白瓷光深碗底盤
            var geo = new THREE.CylinderGeometry(STADIUM_RADIUS, STADIUM_RADIUS - 2.0, 1.2, 64);
            var mat = new THREE.MeshStandardMaterial({
                color: 0xf1f5f9, // 絕美亮白塑膠感
                roughness: 0.15,
                metalness: 0.1
            });
            var stadiumMesh = new THREE.Mesh(geo, mat);
            stadiumMesh.position.y = -0.6;
            scene.add(stadiumMesh);

            // 盤底標誌環
            var centerRingGeo = new THREE.RingGeometry(1.5, 1.8, 32);
            var centerRingMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.DoubleSide });
            var centerRing = new THREE.Mesh(centerRingGeo, centerRingMat);
            centerRing.rotation.x = Math.PI / 2;
            centerRing.position.y = 0.01;
            scene.add(centerRing);

            // 2. 霓虹螢光綠 X-Dash 軌道齒輪環
            var railGeo = new THREE.TorusGeometry(STADIUM_RADIUS - 0.3, 0.22, 16, 64);
            var railMat = new THREE.MeshStandardMaterial({
                color: 0x10b981,
                emissive: 0x10b981,
                emissiveIntensity: 0.7,
                roughness: 0.2
            });
            var railMesh = new THREE.Mesh(railGeo, railMat);
            railMesh.rotation.x = Math.PI / 2;
            railMesh.position.y = 0.05;
            scene.add(railMesh);

            // 3. 半透明藍光高透護罩 (Polycarbonate Wall)
            var wallGeo = new THREE.CylinderGeometry(STADIUM_RADIUS, STADIUM_RADIUS, WALL_HEIGHT, 64, 1, true);
            var wallMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.35,
                roughness: 0.05,
                transmission: 0.9,
                thickness: 0.8,
                side: THREE.DoubleSide
            });
            var wallMesh = new THREE.Mesh(wallGeo, wallMat);
            wallMesh.position.y = WALL_HEIGHT / 2;
            scene.add(wallMesh);

            // 護罩頂部加固藍邊
            var topRingGeo = new THREE.TorusGeometry(STADIUM_RADIUS, 0.12, 16, 64);
            var topRingMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
            var topRing = new THREE.Mesh(topRingGeo, topRingMat);
            topRing.rotation.x = Math.PI / 2;
            topRing.position.y = WALL_HEIGHT;
            scene.add(topRing);

            // 4. 底面物理 (Ground)
            var groundBody = new CANNON.Body({ mass: 0, material: stadiumMaterial });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            // 5. 環形實體物理護牆 (防滑出場外)
            var wallSegments = 32;
            for (var i = 0; i < wallSegments; i++) {
                var angle = (i / wallSegments) * Math.PI * 2;
                var x = Math.cos(angle) * STADIUM_RADIUS;
                var z = Math.sin(angle) * STADIUM_RADIUS;

                var wallBody = new CANNON.Body({ mass: 0, material: stadiumMaterial });
                wallBody.addShape(new CANNON.Plane());
                wallBody.position.set(x, WALL_HEIGHT / 2, z);
                
                var quatY = new CANNON.Quaternion();
                quatY.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), angle + Math.PI);
                wallBody.quaternion = quatY;

                world.addBody(wallBody);
            }
        }

        function launchCustom3DBattle(mode) {
            activeTops.forEach(function(t) { world.remove(t.body); scene.remove(t.group); });
            activeTops = [];

            var p1Name = escapeHtml(document.getElementById('p1-name').value || '火鷹飛龍');
            var p1Spin = document.getElementById('p1-spin').value === 'RIGHT';
            var p1Power = document.getElementById('p1-power').value;
            var p1Rpm = p1Power === 'HEAVY' ? 12000 : (p1Power === 'MEDIUM' ? 9500 : 7000);

            var p1 = new Beyblade3DPhysics(scene, world, defaultMaterial, {
                name: '🔵 ' + p1Name, x: -2.5, y: 0.5, z: 0, rpm: p1Rpm, isRightSpin: p1Spin, color: 0x0284c7
            });
            p1.body.velocity.set(2.2, 0, 1.2);
            activeTops.push(p1);

            if (mode === 'VS_AI') {
                var aiNames = ['🤖 暗黑狂狼', '🤖 幻影巨龍', '🤖 聖光神盾', '🤖 暴風阿修羅'];
                var randomName = aiNames[Math.floor(Math.random() * aiNames.length)];
                var randomSpin = Math.random() > 0.5;
                var randomRpm = 8500 + Math.floor(Math.random() * 3500);

                var ai = new Beyblade3DPhysics(scene, world, defaultMaterial, {
                    name: randomName, x: 2.5, y: 0.5, z: 0, rpm: randomRpm, isRightSpin: randomSpin, color: 0xe11d48
                });
                ai.body.velocity.set(-2.2, 0, -1.2);
                activeTops.push(ai);

                document.getElementById('match-status').innerText = '⚔️ 單人對戰 (VS AI) 中...';

            } else if (mode === 2) {
                var p2Name = escapeHtml(document.getElementById('p2-name').value || '影武赤狼');
                var p2Spin = document.getElementById('p2-spin').value === 'RIGHT';
                var p2Power = document.getElementById('p2-power').value;
                var p2Rpm = p2Power === 'HEAVY' ? 12000 : (p2Power === 'MEDIUM' ? 9500 : 7000);

                var p2 = new Beyblade3DPhysics(scene, world, defaultMaterial, {
                    name: '🔴 ' + p2Name, x: 2.5, y: 0.5, z: 0, rpm: p2Rpm, isRightSpin: p2Spin, color: 0xe11d48
                });
                p2.body.velocity.set(-2.2, 0, -1.2);
                activeTops.push(p2);

                document.getElementById('match-status').innerText = '⚔️ 雙人自訂對戰中...';

            } else if (mode === 4) {
                var p2Name4 = escapeHtml(document.getElementById('p2-name').value || '影武赤狼');
                var p2_4 = new Beyblade3DPhysics(scene, world, defaultMaterial, {
                    name: '🔴 ' + p2Name4, x: 2.5, y: 0.5, z: 0, rpm: 11000, isRightSpin: false, color: 0xe11d48
                });
                p2_4.body.velocity.set(-2.2, 0, -1.2);
                activeTops.push(p2_4);

                var p3 = new Beyblade3DPhysics(scene, world, defaultMaterial, {
                    name: '🟢 翡翠巨錘', x: 0, y: 0.5, z: -2.5, rpm: 9500, isRightSpin: true, color: 0x10b981
                });
                p3.body.velocity.set(1.0, 0, 2.0);
                activeTops.push(p3);

                var p4 = new Beyblade3DPhysics(scene, world, defaultMaterial, {
                    name: '🟣 帝王紫刃', x: 0, y: 0.5, z: 2.5, rpm: 11500, isRightSpin: false, color: 0x8b5cf6
                });
                p4.body.velocity.set(-1.0, 0, -2.0);
                activeTops.push(p4);

                document.getElementById('match-status').innerText = '⚔️ 4 人大亂鬥中...';
            }

            isSimulating = true;

            if (window.innerWidth <= 768) {
                document.getElementById('ui-overlay-box').style.display = 'none';
            }
        }

        function bindEvents() {
            document.getElementById('btn-vs-ai').onclick = function() { launchCustom3DBattle('VS_AI'); };
            document.getElementById('btn-2p').onclick = function() { launchCustom3DBattle(2); };
            document.getElementById('btn-4p').onclick = function() { launchCustom3DBattle(4); };
            document.getElementById('btn-toggle-ui').onclick = function() {
                var box = document.getElementById('ui-overlay-box');
                box.style.display = box.style.display === 'none' ? 'block' : 'none';
            };
        }

        function animate(now) {
            requestAnimationFrame(animate);
            var dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            if (isSimulating) {
                world.step(PHYSICS_FIXED_TIMESTEP, dt, PHYSICS_MAX_SUBSTEPS);

                // 檢測陀螺相撞產生火花
                for (var i = 0; i < activeTops.length; i++) {
                    for (var j = i + 1; j < activeTops.length; j++) {
                        var posA = activeTops[i].body.position;
                        var posB = activeTops[j].body.position;
                        var dist = posA.distanceTo(posB);
                        if (dist < 2.0 && Math.random() > 0.4) {
                            var midX = (posA.x + posB.x) / 2;
                            var midY = (posA.y + posB.y) / 2;
                            var midZ = (posA.z + posB.z) / 2;
                            spawn3DSparks(midX, midY, midZ, 4);
                        }
                    }
                }

                update3DSparks(dt);

                var debugHTML = '';
                activeTops.forEach(function(t) {
                    t.stepPhysics(dt);
                    var angVelOmega = (Math.abs(t.body.angularVelocity.y)).toFixed(1);
                    var linSpeed = t.body.velocity.norm().toFixed(2);
                    var rpm = Math.round((Math.abs(t.body.angularVelocity.y) * 60) / (2 * Math.PI));
                    
                    debugHTML += '<b>' + t.name + '</b><br>' +
                        '• 角速度 ω: ' + angVelOmega + ' rad/s (' + rpm + ' RPM)<br>' +
                        '• 線速度 v: ' + linSpeed + ' m/s<br><br>';
                });

                document.getElementById('physics-telemetry-content').innerHTML = debugHTML;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = initEngine;
    </script>
</body>
</html>
