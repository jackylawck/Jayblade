<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Google Search Console -->
    <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

    <title>爆上陀螺 Jayblade 3D | 剛體力學戰鬥模擬器</title>
    <meta name="description" content="純本地 WebGL/3D 剛體力學戰鬥陀螺對戰模擬器。支援自訂 3D 模型 (.stl) 上傳、WebRTC 遠端連線對戰、Beyblade X 賽場衝刺與熱血對戰。">
    <meta name="keywords" content="爆上陀螺, Jayblade, 戰鬥陀螺X, Beyblade X, 3D物理模擬器, 剛體力學, 異旋吸轉, STL上傳, WebRTC連線">
    
    <meta name="author" content="羅子淇 Jacky Law">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://jackylawck.github.io/Jayblade/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jackylawck.github.io/Jayblade/">
    <meta property="og:title" content="爆上陀螺 Jayblade 3D | 剛體力學戰鬥模擬器">
    <meta property="og:description" content="🌀 高清 3D 剛體力學戰鬥陀螺對戰模擬器！支援 WebRTC P2P 跨裝置連線、自訂 STL 模型、X-Dash 衝刺與多模式對決。">
    <meta property="og:image" content="https://jackylawck.github.io/Jayblade/JaybladeICON-512.png">

    <!-- PWA Icons -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./JaybladeICON-512.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./JaybladeICON-192.png">
    
    <meta name="theme-color" content="#070714">

    <!-- CSP 資安標頭 -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src * 'unsafe-inline' 'unsafe-eval' data: blob: wss:;
        script-src * 'unsafe-inline' 'unsafe-eval';
        style-src * 'unsafe-inline';
        connect-src * wss: https:;
        img-src * data: blob:;
        font-src * data:;
    ">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #070714; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .ui-overlay { position: absolute; top: 10px; left: 10px; z-index: 100; max-height: 95vh; overflow-y: auto; }
        .ui-card { background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(0, 212, 255, 0.4); border-radius: 16px; padding: 14px; width: 340px; box-shadow: 0 10px 40px rgba(0, 212, 255, 0.25); }
        
        @media (max-width: 480px) {
            .ui-card { width: calc(100vw - 20px); max-width: 340px; }
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        h1 { font-size: 1.2rem; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin: 0; }
        .lang-btn { background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; color: #00f2fe; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        p { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; line-height: 1.3; }
        .btn { background: linear-gradient(135deg, #ff7e5f, #feb47b); color: #fff; border: none; padding: 10px 12px; font-size: 0.88rem; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(255, 126, 95, 0.4); transition: transform 0.1s; margin-top: 6px; text-decoration: none; display: block; text-align: center; }
        .btn:active { transform: scale(0.98); }
        .btn-ai { background: linear-gradient(135deg, #00b894, #00cec9); box-shadow: 0 4px 15px rgba(0, 206, 201, 0.4); }
        .btn-online { background: linear-gradient(135deg, #0984e3, #6c5ce7); box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); }
        .btn-purple { background: linear-gradient(135deg, #a855f7, #6366f1); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); }
        .btn-secondary { background: #1e293b; border: 1px solid rgba(255,255,255,0.2); }
        .btn-sm { font-size: 0.75rem; padding: 6px 10px; }
        .status-banner { font-size: 0.85rem; font-weight: bold; color: #38bdf8; margin-bottom: 6px; min-height: 20px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
        
        .parts-panel { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 8px; margin: 6px 0; border: 1px solid rgba(255,255,255,0.08); }
        .parts-panel h3 { font-size: 0.82rem; color: #f59e0b; margin-bottom: 6px; }
        .p2-title { color: #f43f5e !important; }
        .form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 0.75rem; }
        .form-row label { color: #cbd5e1; }
        .form-row select, .form-row input[type="text"], .form-row input[type="color"] { background: rgba(15, 23, 42, 0.8); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 2px 6px; font-size: 0.75rem; width: 60%; }

        .ugc-dropzone { border: 1.5px dashed #00f2fe; border-radius: 8px; padding: 8px; text-align: center; font-size: 0.72rem; color: #00f2fe; background: rgba(0, 242, 254, 0.05); margin-top: 6px; cursor: pointer; transition: background 0.2s; }
        .ugc-dropzone:hover { background: rgba(0, 242, 254, 0.12); }

        .debug-panel { font-family: 'Courier New', Courier, monospace; font-size: 0.72rem; color: #38bdf8; background: rgba(0,0,0,0.75); padding: 8px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.3); margin-top: 6px; line-height: 1.35; }
        .debug-panel h4 { color: #f59e0b; margin-bottom: 4px; font-size: 0.75rem; border-bottom: 1px solid rgba(245, 158, 11, 0.3); padding-bottom: 2px; }
        
        .toggle-ui-btn { position: fixed; bottom: 15px; left: 15px; z-index: 200; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #0f172a; font-weight: 800; border: none; padding: 8px 14px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.5); }
    </style>

    <!-- 依賴庫 CDN (Three.js, Cannon.js, PeerJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <button class="toggle-ui-btn" id="btn-toggle-ui">👁️ 隱藏/顯示選單</button>

    <div class="ui-overlay" id="ui-overlay-box">
        <div class="ui-card">
            <div class="header-row">
                <h1 id="ui-title">🌀 爆上陀螺 Jayblade 3D</h1>
                <button class="lang-btn" id="btn-lang">English</button>
            </div>
            <p id="ui-subtitle">Beyblade X 高清 3D 剛體對戰模擬器</p>
            
            <!-- ⚡ 雙向切換按鈕：連至 2d.html -->
            <a href="./2d.html" class="btn btn-secondary btn-sm" id="btn-back-2d" style="margin-bottom:6px;">
                ⚡ 切換至 2D 經典/省電版 (2D Classic) →
            </a>

            <!-- WebRTC P2P 連線大廳 -->
            <div class="parts-panel" id="online-lobby-panel" style="border:1px solid #6c5ce7; background:rgba(108,92,231,0.1);">
                <h3 id="ui-online-title" style="color:#a29bfe;">🌐 3D WebRTC 遠端連線大廳</h3>
                <div class="form-row">
                    <label id="ui-lbl-myid">我的房間 ID:</label>
                    <b id="my-peer-id" style="color:#00f2fe; font-size:0.75rem;">生成中...</b>
                </div>
                <div style="display:flex; gap:4px; margin-top:4px;">
                    <input type="text" id="join-peer-id" placeholder="貼上對手的 Room ID" style="background:rgba(15,23,42,0.8); color:#38bdf8; border:1px solid rgba(56,189,248,0.3); border-radius:6px; padding:2px 6px; font-size:0.75rem; width:65%;">
                    <button class="btn btn-sm btn-secondary" id="btn-join-room" style="margin-top:0; width:35%;">加入房間</button>
                </div>
                <div id="net-status" style="font-size:0.7rem; color:#f59e0b; margin-top:4px;">狀態: 單機模式</div>
            </div>

            <!-- P1 自訂 -->
            <div class="parts-panel">
                <h3 id="ui-p1-panel-title">🔵 P1 陀螺自訂 (玩家)</h3>
                <div class="form-row"><label>名稱:</label><input type="text" id="p1-name" value="火鷹飛龍"></div>
                <div class="form-row"><label>顏色:</label><input type="color" id="p1-color" value="#0284c7"></div>
                <div class="form-row">
                    <label>撞擊環:</label>
                    <select id="p1-crown">
                        <option value="FEATHER" selected>羽翼飛刃 (Feather Blade)</option>
                        <option value="DRAKE">龍紋重環 (Drake Crown)</option>
                        <option value="HEAVY">裝甲重錘 (Heavy Armor)</option>
                        <option value="WIZARD">魔導圓盾 (Wizard Ring)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>動力底軸:</label>
                    <select id="p1-tip">
                        <option value="FLAT" selected>極速平頭 (Flat Speed)</option>
                        <option value="BALL">持久球軸 (Ball Bearing)</option>
                        <option value="NEEDLE">防禦針軸 (Needle Guard)</option>
                        <option value="ACCEL">軌道衝刺 (Accel Dash)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>旋轉方向:</label>
                    <select id="p1-spin">
                        <option value="RIGHT" selected>右迴旋 (順時針)</option>
                        <option value="LEFT">左迴旋 (逆時針)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>發射力度:</label>
                    <select id="p1-power">
                        <option value="HEAVY" selected>重度 (高轉速)</option>
                        <option value="MEDIUM">中度 (穩定)</option>
                        <option value="LIGHT">輕度 (高精準)</option>
                    </select>
                </div>

                <div class="ugc-dropzone" id="ugc-dropzone">
                    <span id="ugc-drop-text">📁 點擊或拖拽自訂 3D 設計 (.stl) 檔測試實體慣量</span>
                    <input type="file" id="ugc-file-input" accept=".stl" style="display:none;">
                </div>
            </div>

            <!-- P2 自訂 -->
            <div class="parts-panel">
                <h3 id="ui-p2-panel-title" class="p2-title">🔴 P2 陀螺自訂 (對手)</h3>
                <div class="form-row"><label>名稱:</label><input type="text" id="p2-name" value="影武赤狼"></div>
                <div class="form-row"><label>顏色:</label><input type="color" id="p2-color" value="#e11d48"></div>
                <div class="form-row">
                    <label>撞擊環:</label>
                    <select id="p2-crown">
                        <option value="FEATHER">羽翼飛刃 (Feather Blade)</option>
                        <option value="DRAKE" selected>龍紋重環 (Drake Crown)</option>
                        <option value="HEAVY">裝甲重錘 (Heavy Armor)</option>
                        <option value="WIZARD">魔導圓盾 (Wizard Ring)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>動力底軸:</label>
                    <select id="p2-tip">
                        <option value="FLAT">極速平頭 (Flat Speed)</option>
                        <option value="BALL" selected>持久球軸 (Ball Bearing)</option>
                        <option value="NEEDLE">防禦針軸 (Needle Guard)</option>
                        <option value="ACCEL">軌道衝刺 (Accel Dash)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>旋轉方向:</label>
                    <select id="p2-spin">
                        <option value="RIGHT">右迴旋 (順時針)</option>
                        <option value="LEFT" selected>左迴旋 (逆時針)</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>發射力度:</label>
                    <select id="p2-power">
                        <option value="HEAVY" selected>重度 (高轉速)</option>
                        <option value="MEDIUM">中度 (穩定)</option>
                        <option value="LIGHT">輕度 (高精準)</option>
                    </select>
                </div>
            </div>

            <div class="status-banner" id="match-status">請選擇對戰模式發射...</div>
            <button class="btn btn-ai" id="btn-vs-ai">🎮 單人對戰 (VS AI)</button>
            <button class="btn" id="btn-2p">⚔️ 1P vs 2P 同機對戰</button>
            <button class="btn btn-online" id="btn-p2p-launch">🌐 3D 遠端對決 (WebRTC P2P)</button>
            <button class="btn btn-purple" id="btn-4p">🔥 4人障礙大亂鬥</button>

            <div class="debug-panel" id="physics-debug-box">
                <h4 id="ui-debug-title">⚙️ 實時物理數據 (240Hz 算力)</h4>
                <div id="physics-telemetry-content">等待發射數據...</div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- 載入 3D 控制腳本 -->
    <script type="module" src="js/game3d.js"></script>
    
    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Fail:', err));
        });
      }
    </script>
</body>
</html>
